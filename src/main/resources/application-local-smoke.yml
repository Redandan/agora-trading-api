spring:
  datasource:
    url: jdbc:h2:mem:trading-local-smoke;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

meta-control:
  attribution:
    enabled: false
  composite-indicator:
    scheduler-enabled: false
  hourly-orchestrator:
    enabled: false
  ml-materialized-refresh:
    startup-check-enabled: false

market:
  liquidation-ws:
    enabled: false

okx:
  earn-topup:
    enabled: false

polymarket:
  monitor:
    enabled: false

trailing-stop:
  enabled: false

trading:
  mcp:
    api-key: local-smoke-mcp
  internal:
    api-key: local-smoke-internal-key
  short-squeeze-alert:
    enabled: false
    taker-buy-collector-enabled: false
  tiny-live:
    auto-execution:
      enabled: false
  data-freshness:
    shadow-replay:
      collector:
        enabled: false
  wai:
    enabled: false

mcp:
  api-key: local-smoke-mcp
  ops-key: local-smoke-mcp
