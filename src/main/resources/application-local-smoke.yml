spring:
  datasource:
    url: jdbc:h2:mem:trading-local-smoke;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

meta-control:
  migration-drift-check:
    enabled: false

market:
  liquidation-ws:
    enabled: false

trading:
  admin:
    api-key: local-smoke-admin
  mcp:
    api-key: local-smoke-mcp
