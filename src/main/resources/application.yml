server:
  address: 0.0.0.0
  port: ${PORT:8084}
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: agora-trading-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    model:
      chat: none
    chat:
      client:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: ${TRADING_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: trading-sched-
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    table: ${SPRING_FLYWAY_TABLE:trading_flyway_schema_history}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

trading:
  mcp:
    api-key: ${TRADING_MCP_KEY:}
  internal:
    api-key: ${TRADING_INTERNAL_API_KEY:${AGORA_MARKET_INTERNAL_API_KEY:}}
  btc-donchian-shadow:
    mode: ${TRADING_BTC_DONCHIAN_SHADOW_MODE:OFF}
  tradingview:
    local:
      enabled: ${TRADINGVIEW_LOCAL_ENABLED:false}
      strategy-id: ${TRADINGVIEW_LOCAL_STRATEGY_ID:485}
      allowed-symbols: ${TRADINGVIEW_LOCAL_ALLOWED_SYMBOLS:BTCUSDT}
      allowed-intervals: ${TRADINGVIEW_LOCAL_ALLOWED_INTERVALS:1d}
      allowed-sources: ${TRADINGVIEW_LOCAL_ALLOWED_SOURCES:binance}
      history-bars: ${TRADINGVIEW_LOCAL_HISTORY_BARS:320}
      catch-up-bars: ${TRADINGVIEW_LOCAL_CATCH_UP_BARS:3}
      max-signal-age-hours: ${TRADINGVIEW_LOCAL_MAX_SIGNAL_AGE_HOURS:72}
      default-notional-usdt: ${TRADINGVIEW_LOCAL_DEFAULT_NOTIONAL_USDT:10.0}
      max-notional-usdt: ${TRADINGVIEW_LOCAL_MAX_NOTIONAL_USDT:80.0}
      execution-mode: ${TRADINGVIEW_LOCAL_EXECUTION_MODE:BTC_BASE_PAPER}
      btc-base-max-exposure-usdt: ${TRADINGVIEW_LOCAL_BTC_BASE_MAX_EXPOSURE_USDT:250.0}
  oco-poller:
    untracked-min-notional-usdt: ${TRADING_OCO_POLLER_UNTRACKED_MIN_NOTIONAL_USDT:10.0}

mcp:
  api-key: ${MCP_API_KEY:${TRADING_MCP_KEY:}}
  ops-key: ${MCP_OPS_KEY:${TRADING_MCP_KEY:}}

agora-market:
  base-url: ${AGORA_MARKET_BASE_URL:http://127.0.0.1:8080}
  internal-api-key: ${AGORA_MARKET_INTERNAL_API_KEY:}
  timeout-ms: ${AGORA_MARKET_INTERNAL_TIMEOUT_MS:3000}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    channel-id: ${TELEGRAM_BOT_CHANNEL_ID:${TELEGRAM_CHANNEL_ID:}}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    http-proxy: ${TELEGRAM_HTTP_PROXY:}

app:
  cors:
    allowed-origins: ${TRADING_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
