server:
  address: 0.0.0.0
  port: ${PORT:8084}
  shutdown: graceful
  servlet:
    context-path: /api/trading

spring:
  application:
    name: agora-trading-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    model:
      chat: none
    chat:
      client:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: ${TRADING_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: trading-sched-

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

trading:
  admin:
    api-key: ${TRADING_ADMIN_KEY:}
  mcp:
    api-key: ${TRADING_MCP_KEY:}

agora-market:
  base-url: ${AGORA_MARKET_BASE_URL:http://localhost:8080}
  internal-api-key: ${AGORA_MARKET_INTERNAL_API_KEY:}
  timeout-ms: ${AGORA_MARKET_INTERNAL_TIMEOUT_MS:3000}

app:
  cors:
    allowed-origins: ${TRADING_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
