server:
  address: 0.0.0.0
  port: ${PORT:8084}
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  application:
    name: agora-trading-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    model:
      chat: none
    chat:
      client:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: ${TRADING_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: trading-sched-
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    table: ${SPRING_FLYWAY_TABLE:trading_flyway_schema_history}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

trading:
  mcp:
    api-key: ${TRADING_MCP_KEY:}
  internal:
    api-key: ${TRADING_INTERNAL_API_KEY:${AGORA_MARKET_INTERNAL_API_KEY:}}
  tradingview:
    webhook:
      enabled: ${TRADINGVIEW_WEBHOOK_ENABLED:false}
      dry-run: ${TRADINGVIEW_WEBHOOK_DRY_RUN:true}
      secret: ${TRADINGVIEW_WEBHOOK_SECRET:}
      allowed-symbols: ${TRADINGVIEW_WEBHOOK_ALLOWED_SYMBOLS:BTCUSDT}
      default-notional-usdt: ${TRADINGVIEW_WEBHOOK_DEFAULT_NOTIONAL_USDT:10.0}
      max-notional-usdt: ${TRADINGVIEW_WEBHOOK_MAX_NOTIONAL_USDT:10.0}
      idempotency-ttl-hours: ${TRADINGVIEW_WEBHOOK_IDEMPOTENCY_TTL_HOURS:24}
  data-freshness:
    shadow-replay:
      collector:
        enabled: ${TRADING_DATAFRESHNESS_SHADOW_REPLAY_COLLECTOR_ENABLED:false}

mcp:
  api-key: ${MCP_API_KEY:${TRADING_MCP_KEY:}}
  ops-key: ${MCP_OPS_KEY:${TRADING_MCP_KEY:}}

agora-market:
  base-url: ${AGORA_MARKET_BASE_URL:http://127.0.0.1:8080}
  internal-api-key: ${AGORA_MARKET_INTERNAL_API_KEY:}
  timeout-ms: ${AGORA_MARKET_INTERNAL_TIMEOUT_MS:3000}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    channel-id: ${TELEGRAM_BOT_CHANNEL_ID:${TELEGRAM_CHANNEL_ID:}}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    http-proxy: ${TELEGRAM_HTTP_PROXY:}

meta-control:
  ml:
    sql:
      schema: ${META_CONTROL_ML_SQL_SCHEMA:agora_market}
      signal-scorer-training-table: ${META_CONTROL_ML_SQL_SIGNAL_SCORER_TRAINING_TABLE:bt_signal_training_v8_mat}
      weekly-retrain-training-view: ${META_CONTROL_ML_SQL_WEEKLY_RETRAIN_TRAINING_VIEW:vw_signal_training_v2}

app:
  cors:
    allowed-origins: ${TRADING_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
