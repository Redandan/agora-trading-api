server:
  address: 0.0.0.0
  port: ${PORT:8084}
  shutdown: graceful
  servlet:
    context-path: /api/trading

spring:
  application:
    name: agora-trading-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    model:
      chat: none
    chat:
      client:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: ${TRADING_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: trading-sched-
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    table: ${SPRING_FLYWAY_TABLE:trading_flyway_schema_history}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

trading:
  mcp:
    api-key: ${TRADING_MCP_KEY:}
  internal:
    api-key: ${TRADING_INTERNAL_API_KEY:${AGORA_MARKET_INTERNAL_API_KEY:}}

mcp:
  api-key: ${MCP_API_KEY:${TRADING_MCP_KEY:}}
  ops-key: ${MCP_OPS_KEY:${TRADING_MCP_KEY:}}

agora-market:
  base-url: ${AGORA_MARKET_BASE_URL:http://127.0.0.1:8080}
  internal-api-key: ${AGORA_MARKET_INTERNAL_API_KEY:}
  timeout-ms: ${AGORA_MARKET_INTERNAL_TIMEOUT_MS:3000}

meta-control:
  ml:
    sql:
      schema: ${META_CONTROL_ML_SQL_SCHEMA:agora_market}
      signal-scorer-training-table: ${META_CONTROL_ML_SQL_SIGNAL_SCORER_TRAINING_TABLE:bt_signal_training_v8_mat}
      weekly-retrain-training-view: ${META_CONTROL_ML_SQL_WEEKLY_RETRAIN_TRAINING_VIEW:vw_signal_training_v2}

app:
  cors:
    allowed-origins: ${TRADING_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
